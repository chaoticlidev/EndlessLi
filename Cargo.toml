[workspace]
members = ["src-tauri", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
r2d2 = "0.8"
keyring = "4"
reqwest = { version = "0.13", features = ["json", "stream"] }
tiktoken-rs = "0.12"
ammonia = "4"
# Pinned exact: sqlite-vec is pre-1.0 and its SQL surface may change (ADR-014).
# 0.1.10-alpha.4 is skipped: its crates.io package is missing a C source file.
sqlite-vec = "=0.1.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }

el-core = { path = "crates/el-core" }
el-db = { path = "crates/el-db" }
el-analytics = { path = "crates/el-analytics" }
el-llm = { path = "crates/el-llm" }
el-cache = { path = "crates/el-cache" }
el-memory = { path = "crates/el-memory" }
el-linking = { path = "crates/el-linking" }
el-research = { path = "crates/el-research" }
el-compress = { path = "crates/el-compress" }
el-skills = { path = "crates/el-skills" }
el-security = { path = "crates/el-security" }
[workspace.lints.rust]
# Denied (not forbidden) so el-db can allow the single sqlite-vec FFI
# registration call with a documented SAFETY comment.
unsafe_code = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
