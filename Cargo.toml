[workspace]
members = ["src-tauri", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }

el-core = { path = "crates/el-core" }
el-db = { path = "crates/el-db" }
el-analytics = { path = "crates/el-analytics" }
el-llm = { path = "crates/el-llm" }
el-cache = { path = "crates/el-cache" }
el-memory = { path = "crates/el-memory" }
el-linking = { path = "crates/el-linking" }
el-research = { path = "crates/el-research" }
el-compress = { path = "crates/el-compress" }
el-skills = { path = "crates/el-skills" }
el-security = { path = "crates/el-security" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
