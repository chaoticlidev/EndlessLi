[package]
name = "el-analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EndlessLi DuckDB analytical engine, feature-flagged until Phase 6 (ADR-002)"

[dependencies]
el-core = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

# Enabled with `--features duckdb` (src-tauri turns it on by default).
# `bundled` compiles DuckDB from source so no system library is required.
[dependencies.duckdb]
version = "1"
optional = true
features = ["bundled"]

[features]
default = []
duckdb = ["dep:duckdb"]

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true
