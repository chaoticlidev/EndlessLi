[package]
name = "el-analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EndlessLi DuckDB analytical engine, feature-flagged until Phase 6 (ADR-002)"

[dependencies]
el-core = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

# Enabled with `--features duckdb` (src-tauri turns it on by default).
# `bundled` is deliberately NOT enabled: it compiles DuckDB from C++ source and
# bypasses the build script's pre-built library path. With `DUCKDB_DOWNLOAD_LIB=1`
# (set in .cargo/config.toml) libduckdb-sys downloads the official dynamic
# library instead, or `DUCKDB_LIB_DIR` can point at a system installation.
[dependencies.duckdb]
version = "1"
optional = true

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true
