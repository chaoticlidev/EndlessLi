name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  sidecar:
    name: Python sidecar (pytest, mocked transports only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sidecar/requirements-dev.txt
      - run: pip install -r sidecar/requirements-dev.txt
      - run: PYTHONPATH=sidecar pytest sidecar/tests -q

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Stub sidecar binaries for CI
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/endlessli-sidecar-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/endlessli-sidecar-x86_64-pc-windows-msvc.exe
          touch src-tauri/binaries/endlessli-sidecar-aarch64-apple-darwin
          touch src-tauri/binaries/endlessli-sidecar-x86_64-apple-darwin
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  tauri-build:
    name: Tauri build (${{ matrix.os }})
    needs: [frontend, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Stub sidecar binaries for CI
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/endlessli-sidecar-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/endlessli-sidecar-x86_64-pc-windows-msvc.exe
          touch src-tauri/binaries/endlessli-sidecar-aarch64-apple-darwin
          touch src-tauri/binaries/endlessli-sidecar-x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
