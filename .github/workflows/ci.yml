name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  sidecar:
    name: Python sidecar (pytest, mocked transports only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sidecar/requirements-dev.txt
      - run: pip install -r sidecar/requirements-dev.txt
      - run: PYTHONPATH=sidecar pytest sidecar/tests -q

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Download DuckDB prebuilt library
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            URL="https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            URL="https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-osx-universal.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            URL="https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-windows-amd64.zip"
          fi
          mkdir -p libduckdb
          curl -fL "$URL" -o duckdb.zip
          unzip duckdb.zip -d libduckdb
      - name: Set DuckDB runtime library path
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "LD_LIBRARY_PATH=${{ github.workspace }}/libduckdb:$LD_LIBRARY_PATH" >> $GITHUB_ENV
            echo "DUCKDB_LIB_PATH=${{ github.workspace }}/libduckdb" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "DYLD_FALLBACK_LIBRARY_PATH=${{ github.workspace }}/libduckdb:$DYLD_FALLBACK_LIBRARY_PATH" >> $GITHUB_ENV
            echo "DUCKDB_LIB_PATH=${{ github.workspace }}/libduckdb" >> $GITHUB_ENV
          fi
      - name: Stub sidecar binaries for CI
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/endlessli-sidecar-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/endlessli-sidecar-x86_64-pc-windows-msvc.exe
          touch src-tauri/binaries/endlessli-sidecar-aarch64-apple-darwin
          touch src-tauri/binaries/endlessli-sidecar-x86_64-apple-darwin
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          DUCKDB_LIB_DIR: ${{ github.workspace }}/libduckdb
          DUCKDB_INCLUDE_DIR: ${{ github.workspace }}/libduckdb

  tauri-build:
    name: Tauri build (${{ matrix.os }})
    needs: [frontend, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Free up Rust cache space on Linux
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - name: Download DuckDB prebuilt library
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            URL="https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            URL="https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-osx-universal.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            URL="https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-windows-amd64.zip"
          fi
          mkdir -p libduckdb
          curl -fL "$URL" -o duckdb.zip
          unzip duckdb.zip -d libduckdb
      - name: Set DuckDB runtime library path
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "LD_LIBRARY_PATH=${{ github.workspace }}/libduckdb:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "DYLD_FALLBACK_LIBRARY_PATH=${{ github.workspace }}/libduckdb:$DYLD_FALLBACK_LIBRARY_PATH" >> $GITHUB_ENV
          fi
      - name: Stub sidecar binaries for CI
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/endlessli-sidecar-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/endlessli-sidecar-x86_64-pc-windows-msvc.exe
          touch src-tauri/binaries/endlessli-sidecar-aarch64-apple-darwin
          touch src-tauri/binaries/endlessli-sidecar-x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
          DUCKDB_LIB_DIR: ${{ github.workspace }}/libduckdb
          DUCKDB_INCLUDE_DIR: ${{ github.workspace }}/libduckdb
          DUCKDB_DOWNLOAD_LIB: "1"
        with:
          args: ${{ matrix.os == 'ubuntu-latest' && '--bundles deb' || '' }}