[project]
name = "endlessli-sidecar"
version = "1.0.0"
description = "EndlessLi Python sidecar: search, clipping, and ML tools"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
]

[project.optional-dependencies]
# Local ONNX embeddings for auto-linking. Optional so search/clip installs
# stay light; the app degrades gracefully when it is absent.
embeddings = ["fastembed>=0.9,<1"]
dev = ["pytest>=8.0", "fastembed>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
