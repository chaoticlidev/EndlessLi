[project]
name = "endlessli-sidecar"
version = "0.4.0"
description = "EndlessLi Python sidecar: search, clipping, and ML tools"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
