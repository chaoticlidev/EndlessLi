[package]
name = "endlessli"
version.workspace = true
description = "EndlessLi desktop app shell (Tauri 2)"
authors = ["EndlessLi Contributors"]
edition.workspace = true
license.workspace = true

[lib]
name = "endlessli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
el-core = { workspace = true }
el-db = { workspace = true }
el-llm = { workspace = true }
el-cache = { workspace = true }
el-research = { workspace = true }
el-linking = { workspace = true }
el-memory = { workspace = true }
el-security = { workspace = true }
el-analytics = { workspace = true }
el-compress = { workspace = true }
el-skills = { workspace = true }

[features]
default = ["analytics"]
# DuckDB analytical engine, enabled at Phase 6 per ADR-002.
analytics = ["el-analytics/duckdb"]
# Optional full-database encryption (Phase 11.3). Not enabled by default.
sqlcipher = ["el-db/sqlcipher"]

[lints]
workspace = true
